<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 884 698" role="img" aria-labelledby="title desc">
<title id="title">YouTube Premium Gold Diamond Edition</title>
<desc id="desc">A gold and crystal YouTube play emblem with Gold Diamond Edition branding on a black background.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171006"/><stop offset=".52" stop-color="#050505"/><stop offset="1" stop-color="#1b1204"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="0.9" y2="1"><stop stop-color="#fff5c5"/><stop offset=".25" stop-color="#ffe08a"/><stop offset=".55" stop-color="#d99a22"/><stop offset=".8" stop-color="#a9650b"/><stop offset="1" stop-color="#ffe7a1"/></linearGradient>
 <linearGradient id="whiteGold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".42" stop-color="#e8e4d9"/><stop offset=".72" stop-color="#aeb3b6"/><stop offset="1" stop-color="#fff0c1"/></linearGradient>
 <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".28" stop-color="#cfd7df"/><stop offset=".55" stop-color="#6e6250"/><stop offset=".8" stop-color="#fff"/><stop offset="1" stop-color="#d69a29"/></linearGradient>
 <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="2.5"/></filter>
</defs>
<rect width="884" height="698" fill="url(#bg)"/>
<path d="M0 0H884" stroke="url(#gold)" stroke-width="7" filter="url(#glow)"/>
<path d="M0 0 90 0 0 112Z M884 0 884 85 820 0Z" fill="#d99a22" opacity=".18"/>
<rect x="188" y="82" width="506" height="335" rx="73" fill="#000" stroke="#9e6919" stroke-width="14" opacity=".55" filter="url(#soft)"/>
<rect x="190" y="80" width="504" height="337" rx="72" fill="#17130d" stroke="url(#gold)" stroke-width="9" filter="url(#glow)"/>
<rect x="203" y="93" width="478" height="311" rx="59" fill="url(#gem)" opacity=".2"/>
<path d="M228 130 340 95 480 107 650 155 681 253 640 372 504 397 336 384 210 318Z" fill="none" stroke="#fff2c8" stroke-width="3" opacity=".65"/>
<path d="M228 130 340 95 418 180 300 256Z M340 95 480 107 418 180Z M480 107 650 155 540 240 418 180Z M650 155 681 253 540 240Z M210 318 300 256 418 180 380 390 250 370Z M300 256 540 240 380 390Z M540 240 681 253 640 372 380 390Z" fill="url(#gem)" opacity=".55" stroke="#f9e8bf" stroke-width="2"/>
<path d="M382 173 532 250 382 332Z" fill="url(#gold)" stroke="#fff0bd" stroke-width="7" stroke-linejoin="round" filter="url(#glow)"/>
<path d="M382 173 448 250 382 332Z" fill="#fff4ce" opacity=".35"/>
<path d="M625 88l8 20 20 8-20 8-8 20-8-20-20-8 20-8z M190 252l6 15 15 6-15 6-6 15-6-15-15-6 15-6z" fill="#fff4c9" filter="url(#glow)"/>
<text x="78" y="504" font-family="Arial, Helvetica, sans-serif" font-size="77" font-weight="700" letter-spacing="-4" fill="#fff">YouTube</text>
<text x="448" y="504" font-family="Arial, Helvetica, sans-serif" font-size="77" font-weight="700" letter-spacing="-4" fill="url(#gold)">Premium</text>
<rect x="170" y="563" width="540" height="72" rx="36" fill="#090806" stroke="url(#gold)" stroke-width="3"/>
<text x="204" y="610" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#f7d27b">Gold Diamond Edition</text>
<path d="M650 580 668 570 686 580 678 607 658 607Z" fill="url(#whiteGold)" stroke="#f5d27d" stroke-width="2"/>
<path d="M650 580 668 607 686 580 M668 570V607 M650 580H686" fill="none" stroke="#fff" stroke-width="1.5" opacity=".8"/>
<text x="442" y="681" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" letter-spacing="7" fill="#d8d2c5">WATCH MORE. WORRY LESS.</text>
</svg>